name: v87 rank-one quartic covering two-descent for missing generators

on:
  push:
    branches: [research/nested-binomial-2026-11-05]
    paths:
      - '.github/workflows/v87-quartic-2descent-free-points.yml'
      - 'docs/research/nested-binomial/v87_quartic_2descent_free_points.sage'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quartic-descent:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        b: [9,18]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Pull pinned SageMath 10.10
        run: docker pull sagemath/sagemath:10.10
      - name: Prove actual free generator via quartic covering descent
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 255s \
            docker run --rm --network none \
            --mount type=bind,source="$PWD",target=/work,readonly \
            --workdir /work --env HOME=/tmp --env DOT_SAGE=/tmp/.sage \
            sagemath/sagemath:10.10 \
            sage -python docs/research/nested-binomial/v87_quartic_2descent_free_points.sage ${{ matrix.b }} \
            >v87-rho100003-b${{ matrix.b }}.log 2>&1
          rc=$?
          echo "EXIT_CODE=$rc" >>v87-rho100003-b${{ matrix.b }}.log
          grep -E 'V87_BEGIN|V87_QUARTIC|V87_FREE_POINT|V87_SATURATED|V87_ALL|V87_INCOMPLETE|EXIT_CODE' \
            v87-rho100003-b${{ matrix.b }}.log | cut -c 1-2400 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v87-quartic-descent-b${{ matrix.b }}
          path: v87-rho100003-b${{ matrix.b }}.log
          if-no-files-found: error
          retention-days: 30
      - name: Require proven saturated generator and complete integral points
        shell: bash
        run: |
          grep -q V87_ALL_INTEGRAL_POINTS v87-rho100003-b${{ matrix.b }}.log
          grep -q EXIT_CODE=0 v87-rho100003-b${{ matrix.b }}.log
