name: v18 residual elliptic curve ranks

on:
  workflow_dispatch:
  push:
    branches:
      - research/v18-next-descent

jobs:
  compute-ranks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/v18-next-descent

      - name: Install SageMath
        run: |
          sudo apt-get update
          sudo apt-get install -y sagemath

      - name: Run residual curve rank computation
        run: |
          cd docs/research/nested-binomial
          sage v18_compute_ranks.sage > v18_ranks_output.txt 2>&1 || true
          # Also generate a markdown summary
          {
            echo "# Residual curve ranks (a ≤ 5)"
            echo "Generated by GitHub Actions on $(date -u)"
            echo ""
            echo '\`\`\`'
            cat v18_ranks_output.txt
            echo '\`\`\`'
          } > v18_ranks_summary.md

      - name: Commit results
        run: |
          cd docs/research/nested-binomial
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v18_ranks_output.txt v18_ranks_summary.md
          git diff --staged --quiet || git commit -m "Update residual curve rank results from Sage"
          git push

