name: Pell v4.2 original radical equivalence
on:
  push:
    branches: [research/pell-prime-external-v3-20261125]
    paths:
      - 'docs/research/pell-prime-v3/V42Full.lean'
      - '.github/workflows/pell-v42-full.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          git clone --depth 1 --branch v4.24.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib
          cd /tmp/mathlib
          lake exe cache get
          cp "$GITHUB_WORKSPACE/docs/research/pell-prime-v3/"{V4Radical,V41Finish,V42Full}.lean .
          set -o pipefail
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/V4Radical.olean V4Radical.lean | tee /tmp/full.log
          lake env lean -o .lake/build/lib/lean/V41Finish.olean V41Finish.lean | tee -a /tmp/full.log
          lake env lean V42Full.lean | tee -a /tmp/full.log
          ! grep -E 'sorryAx|trustCompiler|ofReduceBool|declaration uses.*sorry' /tmp/full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-log
          path: /tmp/full.log
