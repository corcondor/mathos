name: v110 unconditional any-k single-prime polynomial roots

on:
  push:
    branches:
      - research/nested-binomial-2026-11-05
    paths:
      - '.github/workflows/v110-arbitrary-k-root-isolation.yml'
      - 'docs/research/nested-binomial/v110_arbitrary_k_single_prime_roots.py'
      - 'docs/research/nested-binomial/v106_nonlocal_prime_units_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install finite-field factorization library
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-input sympy==1.13.3
      - name: Run generic k-root isolation and bigint checks on selected examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts
          python3 -u docs/research/nested-binomial/v110_arbitrary_k_single_prime_roots.py \
            --k 3 6 8 10 14 17 \
            --crosscheck \
            --output audit-artifacts/v110_arbitrary_k.json \
            | tee audit-artifacts/v110_arbitrary_k.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audit-artifacts/v110_arbitrary_k.json').read_text())
          assert d['status']=='PASS_UNCONDITIONAL_ARBITRARY_K_DECISION_ALGORITHM'
          assert not d['all_k_nonexistence_proven']
          assert not d['original_four_variable_problem_solved']
          assert len(d['cases'])==6
          assert {c['k'] for c in d['cases']}=={3,6,8,10,14,17}
          for c in d['cases']:
              assert c['q_prime_proven_by_trial_division']
              assert c['q_gt_k_cubed'] and c['q_less_than_2k_cubed']
              assert c['root_certificate']['verified_frobenius_gcd_equals_all_linear_root_factors']
              assert len(c['all_height_admissible_integer_candidates'])<=c['k']
              assert c['exact_bigint_candidate_evaluations']<=c['k']
              assert not c['exhaustive_search_over_i']
              assert c['certified_result']=='NO_SOLUTION_FOR_THIS_FIXED_K'
              assert not c['original_equation_solutions_with_v101_height']
          assert next(c for c in d['cases'] if c['k']==14)['root_certificate']['no_field_roots']
          assert next(c for c in d['cases'] if c['k']==8)['exact_bigint_candidate_evaluations']>0
          print('PASS: 6 k examples, independent root-completeness gcd, bigint exact checks')
          print('SCOPE: algorithm valid for ANY k, NOT a universal all-k no-solution theorem')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v110-bertrand-single-prime-all-k-root-isolation-certificates
          path: audit-artifacts/v110_*
          retention-days: 60
