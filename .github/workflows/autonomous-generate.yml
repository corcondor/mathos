name: MathOS autonomous generation

# 誰も見ていない時も MathOS が問題を作り続ける。
# 族ごとに並列シャードで大規模探索し、最後に1つのプールへマージしてコミットする。
# PC も Claude も不要。計算資源(GitHub Actions)を並列に使い切る。
on:
  schedule:
    # 研究ワークフローの定期実行を止めて、その枠をこちらへ回した。
    # 同じ計算資源で、誰も読まないファイルではなく問題が増える。
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      explore:
        description: "1シャードあたりの探索サンプル数"
        required: false
        default: "6000"
      rounds:
        description: "1シャードのラウンド数"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: mathos-autonomous
  cancel-in-progress: false

jobs:
  # ── 1) 族ごとに並列探索（20並列まで使える枠を活用） ──
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        family:
          - cubic_tangent
          - parabola
          - complex_affine
          - ultradeep_cyclotomic_norm
          - ultradeep_cubic_triangle
          - geometry_astroid
          - geometry_parabola_evolute
          - geometry_orthocenter_locus
          - geometry_minkowski_polygon
          - geometry_spatial
          # トレースバック方式: 1構築の演繹閉包を丸ごと切り出すシャード
          - traceback_regular_polygon
          - traceback_cubic_tangent
          - traceback_lattice_path
          - traceback_digit_power
          - traceback_triangle_centers
          - traceback_hyperbola_asymptote
          - traceback_incircle_excircle
          - traceback_parabola_focal_chord
          - traceback_cyclic_quadrilateral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install -r requirements-ci.txt

      - name: Explore ${{ matrix.family }}
        env:
          EXPLORE: ${{ github.event.inputs.explore || '6000' }}
          ROUNDS: ${{ github.event.inputs.rounds || '1' }}
        run: |
          OUT="shard_${{ matrix.family }}.json"
          if [[ "${{ matrix.family }}" == ultradeep_* || "${{ matrix.family }}" == geometry_* || "${{ matrix.family }}" == traceback_* ]]; then
            echo "--- ${{ matrix.family }} exact parameter grid ---"
            python autonomous_loop.py \
              --family "${{ matrix.family }}" \
              --explore 0 \
              --out "$OUT"
          else
            for r in $(seq 1 "$ROUNDS"); do
              echo "--- ${{ matrix.family }} round $r ---"
              python autonomous_loop.py \
                --family "${{ matrix.family }}" \
                --explore "$EXPLORE" \
                --seed $((RANDOM * r + r)) \
                --out "$OUT"
            done
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.family }}
          path: shard_${{ matrix.family }}.json
          if-no-files-found: ignore

  # ── 2) 全シャードをマージして1つのプールにし、コミット ──
  merge:
    needs: explore
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install -r requirements-ci.txt

      - name: Refresh audience skip snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python refresh_selection_feedback.py

      - name: Verify relation closure and non-gating quality policy
        run: >-
          python -m unittest
          test_relation_engine
          test_iterated_relation_closure
          test_passage_region_closure
          test_wolfram_region_engine
          test_world_novelty_index
          test_difficulty_reference
          test_morphology_graph
          test_morphology_geometry_synthesis
          test_morphology_path_synthesis
          test_motif_guided_synthesis
          test_pool_quality_policy
          test_delivery_curation
          test_traceback_surface_contract
          test_autonomous_shard_isolation
          test_geometry_deep_families
          test_audience_skip_filter
          test_sync_supabase

      - uses: actions/download-artifact@v4
        with:
          path: shards
          merge-multiple: true

      - name: Merge shards into the pool
        run: |
          ls -la shards || true
          # 既存プールも入力に含めて蓄積する
          python merge_shards.py \
            --inputs shards/shard_*.json \
            --base problem_synthesis/construct_pool.json \
            --output problem_synthesis/construct_pool.json | tee merge_summary.json
          python export_generation_report.py
          python export_morphology_atlas.py
          python build_entrance_pool.py

      - name: Detect semantic pool changes
        id: pool_changes
        shell: bash
        run: |
          CHANGED=$(python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          merge = json.loads(Path("merge_summary.json").read_text(encoding="utf-8"))

          def semantic(payload):
              return {key: value for key, value in payload.items() if key != "generated_at"}

          current = json.loads(
              Path("problem_synthesis/entrance_exam_pool.json").read_text(encoding="utf-8")
          )
          previous = json.loads(
              subprocess.check_output(
                  ["git", "show", "HEAD:problem_synthesis/entrance_exam_pool.json"],
                  text=True,
                  encoding="utf-8",
              )
          )
          changed = bool(merge.get("semantic_change")) or semantic(current) != semantic(previous)
          print("true" if changed else "false")
          PY
          )
          if [[ "$CHANGED" == "false" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No structural pool change; skip database synchronization."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # PC を開いていなくても、作った問題がそのままサイトと Discord に届く。
      # 鍵が未設定なら何もせず通過する。
      - name: Sync the pool into Supabase
        if: steps.pool_changes.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_supabase.py

      - name: Commit grown pool
        if: steps.pool_changes.outputs.changed == 'true'
        run: |
          git config user.name  "mathos-bot"
          git config user.email "mathos-bot@users.noreply.github.com"
          git add problem_synthesis/construct_pool.json \
                  problem_synthesis/entrance_exam_pool.json \
                  problem_synthesis/unresolved_candidates.json \
                  docs/generated/latest-generation-report.md \
                  docs/generated/latest-entrance-pool-report.md \
                  docs/generated/latest-morphology-atlas.md \
                  docs/generated/latest-research-candidates.md
          if git diff --cached --quiet; then
            echo "no new problems this run"
            exit 0
          fi
          TOTAL=$(python -c "import json;print(json.load(open('problem_synthesis/construct_pool.json',encoding='utf-8'))['summary']['total'])")

          # ここで扱うのは全部「生成物」なので、人の変更と混ぜて rebase する
          # 意味がない。以前は rebase が衝突して中断し、detached HEAD のまま
          # push して exit 128 で落ちていた。
          # remote に合わせてから生成物を置き直す方式にする。衝突しない。
          mkdir -p /tmp/outputs
          cp problem_synthesis/construct_pool.json \
             problem_synthesis/entrance_exam_pool.json \
             problem_synthesis/unresolved_candidates.json /tmp/outputs/ 2>/dev/null || true
          cp docs/generated/latest-*.md /tmp/outputs/ 2>/dev/null || true

          git rebase --abort 2>/dev/null || true
          git fetch origin master
          git reset --hard origin/master

          cp /tmp/outputs/construct_pool.json \
             /tmp/outputs/entrance_exam_pool.json \
             /tmp/outputs/unresolved_candidates.json problem_synthesis/ 2>/dev/null || true
          cp /tmp/outputs/latest-*.md docs/generated/ 2>/dev/null || true

          git add problem_synthesis docs/generated
          if git diff --cached --quiet; then
            echo "remote already has these outputs"
            exit 0
          fi
          git commit -m "autonomous(parallel): pool now ${TOTAL} problems"
          # 明示的な refspec を使う。detached でも確実に master へ入る。
          git push origin HEAD:master

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merge-summary
          path: merge_summary.json
          if-no-files-found: ignore
