name: v55 rank proof for exceptional 6-torsion genus-two fibre T=24

on:
  push:
    branches: [research/nested-binomial-2026-11-05]
    paths:
      - '.github/workflows/v55-torsion-six-rank.yml'
      - 'docs/research/nested-binomial/v54_torsion_six_genus2_verify.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  torsion-six-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - name: Exact torsion six and genus-two lift algebra
        run: python docs/research/nested-binomial/v54_torsion_six_genus2_verify.py
      - name: Pull pinned SageMath
        run: docker pull sagemath/sagemath:10.10
      - name: Certify rank E1_24 using PARI
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 120s \
            docker run --rm --network none \
            --mount type=bind,source="$PWD",target=/work,readonly \
            --workdir /work --env HOME=/tmp --env DOT_SAGE=/tmp/.sage \
            sagemath/sagemath:10.10 \
            sage -python docs/research/nested-binomial/v52_retry_pari_ranks.sage E1 24 1 10 \
            > v55-T24-rank-proof.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> v55-T24-rank-proof.log
          cat v55-T24-rank-proof.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v55-T24-rank-proof-and-ten-points
          path: v55-T24-rank-proof.log
          if-no-files-found: error
          retention-days: 30
      - name: Require an honest rank result
        run: |
          grep -Eq 'PROVED_RANK|INCOMPLETE_RANK_NOT_PROVED' v55-T24-rank-proof.log
          echo 'Check the log for actual rank before claiming all points.'
