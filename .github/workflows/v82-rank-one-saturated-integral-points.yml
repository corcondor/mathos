name: v82 certified rank-one full basis and integral points on last two rho fibres

on:
  push:
    branches: [research/nested-binomial-2026-11-05]
    paths:
      - '.github/workflows/v82-rank-one-saturated-integral-points.yml'
      - 'docs/research/nested-binomial/v82_analytic_rank_one_integral_points.sage'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-saturate-enumerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        b: [9,18]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Pull fixed SageMath version
        run: docker pull sagemath/sagemath:10.10
      - name: Find generator and certify full saturation, then ALL integral points
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 320s \
            docker run --rm --network none \
            --mount type=bind,source="$PWD",target=/work,readonly \
            --workdir /work --env HOME=/tmp --env DOT_SAGE=/tmp/.sage \
            sagemath/sagemath:10.10 \
            sage -python docs/research/nested-binomial/v82_analytic_rank_one_integral_points.sage ${{ matrix.b }} \
            >v82-rho100003-b${{ matrix.b }}.log 2>&1
          status=$?
          echo "EXIT_CODE=$status" >>v82-rho100003-b${{ matrix.b }}.log
          grep -E 'V82_BEGIN|V82_MINIMAL|V82_POINT_SEARCH|V82_NONTORSION|V82_FULL|V82_COMPLETE|V82_INCOMPLETE|EXIT_CODE' \
            v82-rho100003-b${{ matrix.b }}.log | cut -c 1-1800 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v82-proven-or-incomplete-original-rho-b${{ matrix.b }}
          path: v82-rho100003-b${{ matrix.b }}.log
          if-no-files-found: error
          retention-days: 35
      - name: Green only if saturation and entire integral set certified
        run: |
          grep -q V82_COMPLETE v82-rho100003-b${{ matrix.b }}.log
          grep -q EXIT_CODE=0 v82-rho100003-b${{ matrix.b }}.log
