name: Pell v4.3 cyclotomic kernel audit
on:
  push:
    branches: [research/pell-prime-external-v3-20261125]
    paths:
      - 'docs/research/pell-prime-v3/V43*.lean'
      - 'docs/research/pell-prime-v3/V44*.lean'
      - '.github/workflows/pell-v43-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify pinned mathlib and proof modules
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v4.24.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib
          cd /tmp/mathlib
          test "$(git rev-parse HEAD)" = f897ebcf72cd16f89ab4577d0c826cd14afaafc7
          lake exe cache get
          lean --version
          cp "$GITHUB_WORKSPACE/docs/research/pell-prime-v3/"{V4Radical,V41Finish,V42Full,V4Trace,V43Cyclotomic}.lean .
          mkdir -p .lake/build/lib/lean
          for m in V4Radical V41Finish V42Full V4Trace; do
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean"
          done
          lake env lean V43Cyclotomic.lean | tee /tmp/cyclotomic.log
          ! grep -E 'sorryAx|trustCompiler|ofReduceBool|declaration uses.*sorry' /tmp/cyclotomic.log
          python3 - <<'PY'
          import re
          s=open('/tmp/cyclotomic.log').read()
          allowed={'propext','Classical.choice','Quot.sound'}
          expected={'HP_spec','HP_aeval','HP_map','HP_trace_root','quadratic_degree_bound','HP_minpoly_of_gen','HP_minpoly_cyclotomic','trace_eq_coefs','radical_iff_trace','norm_obstruction','trace_modular_obstruction'}
          seen=set()
          for name,deps in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s):
              assert {x.strip() for x in deps.split(',') if x.strip()} <= allowed, (name,deps)
              if name.startswith('PellCyclotomicV43.'): seen.add(name.split('.')[-1])
          for name in re.findall(r"'([^']+)' does not depend on any axioms",s):
              if name.startswith('PellCyclotomicV43.'): seen.add(name.split('.')[-1])
          assert expected <= seen, expected-seen
          print('PASS: v4.3 kernel axiom allowlist',len(seen))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v43-kernel-audit
          path: /tmp/cyclotomic.log

  order:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify v4.4 order of apparition
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v4.24.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib
          cd /tmp/mathlib
          test "$(git rev-parse HEAD)" = f897ebcf72cd16f89ab4577d0c826cd14afaafc7
          lake exe cache get
          cp "$GITHUB_WORKSPACE/docs/research/pell-prime-v3/"{V4Trace,V44Order}.lean .
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/V4Trace.olean V4Trace.lean
          lake env lean V44Order.lean | tee /tmp/order.log
          ! grep -E 'sorryAx|trustCompiler|ofReduceBool|declaration uses.*sorry' /tmp/order.log
          python3 - <<'PY'
          import re
          s=open('/tmp/order.log').read()
          allowed={'propext','Classical.choice','Quot.sound'}
          expected={'H_zero_iff_pow','order_eq_prime_of_pow','H_zero_iff_order','cross_sign_impossible','same_sign_unique','H_intCast','A_zero_iff_order','B_zero_iff_order'}
          seen=set()
          for name,deps in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",s):
              assert {x.strip() for x in deps.split(',') if x.strip()} <= allowed, (name,deps)
              if name.startswith('PellOrderV44.'): seen.add(name.split('.')[-1])
          for name in re.findall(r"'([^']+)' does not depend on any axioms",s):
              if name.startswith('PellOrderV44.'): seen.add(name.split('.')[-1])
          assert expected <= seen, expected-seen
          print('PASS: v4.4 kernel axiom allowlist',len(seen))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v44-order-audit
          path: /tmp/order.log
